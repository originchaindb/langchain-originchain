name: Framework adapter acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.frameworks }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            frameworks: minimum
            os: ubuntu-24.04
            consumer-python: consumer/bin/python
          - python: '3.12'
            frameworks: latest
            os: ubuntu-24.04
            consumer-python: consumer/bin/python
          - python: '3.14'
            frameworks: latest
            os: ubuntu-24.04
            consumer-python: consumer/bin/python
          - python: '3.12'
            frameworks: latest
            os: windows-2022
            consumer-python: consumer/Scripts/python.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install real framework and pinned core SDK source
        run: |
          python -m pip install --upgrade pip
          if [ '${{ matrix.frameworks }}' = minimum ]; then
            echo 'langchain-core==0.3.0' > constraints.txt
            export PIP_CONSTRAINT="$PWD/constraints.txt"
          fi
          python -m pip install 'originchain @ git+https://github.com/originchaindb/originchaindb-python.git@944cd410ffb11110c00ce925c0c609e11862916b'
          python -m pip install '.[dev]' build twine
          python -m pip freeze > dependencies.txt
          python -m pip check
      - name: Real framework contracts and mocked HTTP regressions
        run: |
          python -m pytest -q --import-mode=importlib tests --junitxml=framework-tests.xml
          python -m ruff check src tests
          python -m ruff format --check src tests
      - name: Build wheel and sdist
        run: |
          python -m build
          python -m twine check dist/*
          python -c "import pathlib,tarfile,subprocess; p=next(pathlib.Path('dist').glob('*.tar.gz')); a=tarfile.open(p); files={x.name.split('/',1)[1]:a.extractfile(x).read() for x in a.getmembers() if x.isfile()}; tracked=subprocess.check_output(['git','ls-files'],text=True).splitlines(); assert set(files)==set(tracked)|{'PKG-INFO'}; assert all(files[f]==pathlib.Path(f).read_bytes() for f in tracked)"
      - name: Fresh-install exact wheels and repeat acceptance
        run: |
          python -m venv consumer
          if [ '${{ matrix.frameworks }}' = minimum ]; then
            export PIP_CONSTRAINT="$PWD/constraints.txt"
          fi
          '${{ matrix.consumer-python }}' -m pip install 'originchain @ git+https://github.com/originchaindb/originchaindb-python.git@944cd410ffb11110c00ce925c0c609e11862916b'
          '${{ matrix.consumer-python }}' -m pip install dist/*.whl pytest
          '${{ matrix.consumer-python }}' -m pip check
          '${{ matrix.consumer-python }}' -m pytest -q --import-mode=importlib tests --junitxml=installed-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: adapter-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.frameworks }}
          path: |
            framework-tests.xml
            installed-tests.xml
            dependencies.txt
            dist/*
            SOURCE_PROVENANCE.json
